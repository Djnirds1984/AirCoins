# AirCoins PisoWiFi - dnsmasq configuration
# DHCP + DNS redirect for captive portal
# Install to: /etc/dnsmasq.conf

# Interface to bind to
interface=wlan0

# Bind only to the WiFi interface
bind-interfaces

# DHCP range for connected clients
# Pool: 192.168.42.100 to 192.168.42.200 (100 clients)
dhcp-range=192.168.42.100,192.168.42.200,255.255.255.0,12h

# Gateway address (this is the Orange Pi's IP on wlan0)
dhcp-option=3,192.168.42.1

# DNS server - redirect ALL DNS to our portal IP (captive portal trick)
dhcp-option=6,192.168.42.1

# Default route
dhcp-option=15,local

# Lease file location
dhcp-leasefile=/var/lib/dnsmasq/dnsmasq.leases

# Captive portal detection - redirect everything to our portal
# Redirect all DNS queries to the portal IP
address=/#/192.168.42.1

# Android captive portal detection
address=/connectivitycheck.gstatic.com/192.168.42.1
address=/clients3.google.com/192.168.42.1
address=/connectivitycheck.android.com/192.168.42.1

# Windows captive portal detection
address=/www.msftncsi.com/192.168.42.1
address=/www.msftconnecttest.com/192.168.42.1

# Apple captive portal detection
address=/captive.apple.com/192.168.42.1
address=/www.apple.com/192.168.42.1

# Firefox captive portal detection
address=/detectportal.firefox.com/192.168.42.1

# Common connectivity check domains
address=/networktest.apple.com/192.168.42.1
address=/time-ios.apple.com/192.168.42.1

# DNS resolution order
# Listen on port 53
port=53

# Domain for DHCP
domain=local

# Local domain
local=/local/

# No hosts file processing
no-hosts

# Log queries (for debugging - comment out in production)
# log-queries

# Cache size
cache-size=1000

# No ping check before leasing
no-ping

# Fast DHCP
dhcp-fast-reply
