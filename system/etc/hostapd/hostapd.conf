# AirCoins PisoWiFi - hostapd configuration
# WiFi Access Point for Orange Pi One
# Install to: /etc/hostapd/hostapd.conf

# Interface - use wlan0 for Orange Pi built-in WiFi
interface=wlan0

# Driver - nl80211 for most WiFi chips on Orange Pi
driver=nl80211

# SSID (WiFi Network Name)
ssid=AirCoins_Free

# Country code (required for regulatory compliance)
country_code=PH

# Operation mode - a=5GHz, b=2.4GHz 802.11b, g=2.4GHz 802.11g
hw_mode=g

# Channel (1-13 for 2.4GHz)
channel=6

# 802.11n support
ieee80211n=1

# WMM (Wi-Fi Multimedia)
wmm_enabled=1

# Authentication - OPEN (no password for PisoWiFi)
auth_algs=1
wpa=0

# MAC address filtering (0=disabled, 1=allow only, 2=deny only)
macaddr_acl=0

# Beacon interval (in TU - Time Units, default 100)
beacon_int=100

# DTIM period
dtim_period=2

# Max number of stations
max_num_sta=32

# RTS threshold
rts_threshold=2347

# Fragmentation threshold
fragm_threshold=2346

# P2P go intent (for WiFi Direct compatibility)
p2p_go_intent=7

# Ignore probe requests from other BSS
ignore_broadcast_ssid=0

# Isolate clients from each other (security)
ap_isolate=1
