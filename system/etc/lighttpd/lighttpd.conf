# AirCoins PisoWiFi - lighttpd configuration
# Lightweight web server for serving the portal
# Install to: /etc/lighttpd/lighttpd.conf

# Server root - where the HTML files live
server.document-root = "/var/www/html"

# Listen on port 80
server.port = 80

# Bind to the WiFi interface IP
server.bind = "0.0.0.0"

# Server tag (hidden for security)
server.tag = "AirCoins"

# Username for the server process
server.username = "www-data"
server.groupname = "www-data"

# PID file
server.pid-file = "/var/run/lighttpd.pid"

# Error log
server.errorlog = "/var/log/lighttpd/error.log"

# Access log
accesslog.filename = "/var/log/lighttpd/access.log"

# MIME types
mimetype.assign = (
    ".html" => "text/html",
    ".htm"  => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".gif"  => "image/gif",
    ".svg"  => "image/svg+xml",
    ".ico"  => "image/x-icon",
    ".txt"  => "text/plain",
    ".xml"  => "application/xml",
    ".woff" => "font/woff",
    ".woff2" => "font/woff2"
)

# Default index file
index-file.names = ( "index.html" )

# URL rewriting - clean API URLs
url.rewrite-once = (
    "^/api/status\.json$" => "/api/status.json",
    "^/api/coin_event\.json$" => "/api/coin_event.json"
)

# Error pages
server.error-handler-404 = "/index.html"

# Directory listing (disabled for security)
dir-listing.encoding = "utf-8"
server.dir-listing = "disable"

# Compression (optional - saves bandwidth)
# server.modules += ( "mod_compress" )
# compress.cache-dir = "/var/cache/lighttpd/compress/"
# compress.filetype = ( "text/html", "text/css", "application/javascript" )

# Modules to load
server.modules = (
    "mod_access",
    "mod_accesslog",
    "mod_rewrite",
    "mod_redirect",
    "mod_cgi",
    "mod_proxy"
)

# Reverse proxy: forward /api/* to Go backend
$HTTP["url"] =~ "^/api/" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8080 )) )
}

# CGI configuration for admin API
$HTTP["url"] =~ "^/cgi-bin/" {
    cgi.assign = ( "" => "/bin/bash" )
}

# Captive portal: redirect all HTTP to portal
# This catches any HTTP request and serves our portal page
$HTTP["host"] != "192.168.42.1" {
    url.redirect = ( "^/(.*)" => "http://192.168.42.1/$1" )
}

# Max connections
server.max-connections = 128

# File descriptor cache
server.max-fds = 256

# Network settings
server.network-backend = "writev"
server.max-read-idle = 60
server.max-write-idle = 60
server.max-keep-alive-idle = 30
server.max-keep-alive-requests = 16
