# ============================================
# AirCoins - Captive Portal Configuration
# ============================================
# Install to: /etc/pisowifi/captive.conf
#
# Sourced by aircoins-captive-rules.
# Values set here override the built-in defaults.
# ============================================

# Upstream resolver for authorized (paying) clients.
# When set, it is used as a fallback when the dynamic DNS forwarder
# (port 5353) is not available. Leave empty for auto-detect from
# /etc/resolv.conf (recommended). The dynamic forwarder is the primary
# path now: authorized clients' DNS is REDIRECT'ed to port 5353, which
# follows /etc/resolv.conf, so they keep internet when the ISP/DHCP
# changes. This value is kept for backward compatibility and as a
# fallback, but it is NOT embedded into per-MAC rules anymore (those
# now target the forwarder port, not a frozen IP).
# UPSTREAM_DNS=8.8.8.8
UPSTREAM_DNS=

# Internet uplink interface used for MASQUERADE.
# Leave empty to auto-detect from the default route.
WAN_IFACE=
