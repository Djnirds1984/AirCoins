# ============================================
# AirCoins PisoWiFi - Central Configuration
# ============================================
# Install to: /etc/pisowifi/pisowifi.conf
#
# This file is sourced by pisowifi-ctl, pisowifi-session-manager and the
# iptables rules script. Values set here override the built-in defaults.
#
# IMPORTANT - WiFi interface:
#   The Orange Pi PC / One has NO onboard WiFi. You must plug in a USB WiFi
#   adapter that supports AP (master) mode. The interface name assigned to it
#   may vary between adapters and kernels (e.g. wlan0, wlan1, wlx001122334455).
#
#   Find your adapter's interface name with one of:
#       ip link
#       iw dev
#
#   Then set WIFI_IFACE below to match and run:  pisowifi-ctl restart
# ============================================

# WiFi AP interface - clients connect to this (default: wlan0)
WIFI_IFACE=wlan0

# Ethernet uplink interface - provides internet (default: eth0)
ETH_IFACE=eth0

# Portal IP / gateway address on the WiFi interface
PORTAL_IP=192.168.42.1

# WiFi client network (CIDR)
WIFI_NET=192.168.42.0/24
